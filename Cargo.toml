[package]
name = "sshdeck"
version = "0.1.0"
edition = "2024"
description = "Лёгкий SSH-клиент для Linux: SFTP-дерево файлов и терминал в одном окне"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
vte = { package = "vte4", version = "0.10", features = ["v0_72"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "fs", "sync", "time", "macros"] }
tokio-util = "0.7"
openssh-sftp-client = "0.15"
async-channel = "2"
futures-util = "0.3"
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
rusqlite = "0.42"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "native-tls-tls"] }
oo7 = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
